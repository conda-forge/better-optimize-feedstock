{% set name = "better-optimize" %}
{% set version = "0.5.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/better_optimize-{{ version }}.tar.gz
  sha256: 524bd7009ebde6a5874e8cc65f3c0e47e5c2302013b4edbceff68d0c66e74949

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - numpy
    - setuptools
    - versioneer
    - pip
  run:
    - joblib >=1.4
    - pandas
    - threadpoolctl
    - python >={{ python_min }}
    - numpy
    - scipy >=1.18
    - rich

test:
  imports:
    - better_optimize
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/jessegrabowski/better_optimize
  summary: A drop-in replacement for scipy optimize functions with quality of life improvements
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jessegrabowski
    - maresb
